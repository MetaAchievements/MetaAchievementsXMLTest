<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta Achievements XML Data Viewer & Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --card-hover: #1c263b;
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --score-color: #ff9800;
      --unlocked-green: #4caf50;
      --gold-100: #ffd700;
      --gold-dark: #b8860b;
      --badge-bg: #1e293b;
      --badge-unlocked-bg: rgba(76, 175, 80, 0.08);
      --badge-unlocked-border: rgba(76, 175, 80, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
      line-height: 1.5;
    }

    .app-container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .upload-box {
      background: var(--card-bg);
      border: 2px dashed rgba(99, 102, 241, 0.4);
      border-radius: 16px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-bottom: 30px;
    }

    .upload-box:hover, .upload-box.dragover {
      border-color: #8b5cf6;
      background: var(--card-hover);
    }

    .upload-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .upload-box h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .upload-box p {
      font-size: 13px;
      color: var(--text-muted);
    }

    #fileInput {
      display: none;
    }

    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .avatar-wrapper img, .avatar-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-color);
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .user-info {
      flex: 1;
      min-width: 200px;
    }

    .user-info h2 {
      font-size: 22px;
      font-weight: 700;
    }

    .user-info p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .stat-val.score {
      color: var(--score-color);
    }

    .stat-lbl {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .controls-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    /* Games List - Matching achievements.html / achievementsbeta.html */
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .app-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .app-card-100-percent {
      border: 2px solid var(--gold-100);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
    }

    .app-card-100-percent .app-info h3 {
      color: var(--gold-100);
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .app-icon {
      width: 100px;
      height: 100px;
      background: #1e293b;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 40px;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .app-info {
      flex: 1;
      min-width: 0;
    }

    .app-info h3 {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
      word-break: break-word;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .app-id-tag {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .badge-100-tag {
      background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .app-stats {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      border-radius: 10px;
      text-align: center;
      flex: 1;
    }

    .app-card-100-percent .stat {
      border-color: rgba(255, 215, 0, 0.3);
    }

    .stat-value {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .stat.score-stat .stat-value {
      color: var(--score-color);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .toggle-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .toggle-btn:hover {
      background: var(--accent-hover);
    }

    .app-card-100-percent .toggle-btn {
      background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      color: #000;
    }

    .app-card-100-percent .toggle-btn:hover {
      background: linear-gradient(135deg, #b8860b 0%, #8b6508 100%);
      color: #fff;
    }

    .achievements-section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .achievement-badge {
      background: var(--badge-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      transition: all 0.2s;
    }

    .achievement-badge:hover {
      transform: translateX(3px);
    }

    .achievement-badge.unlocked {
      background: var(--badge-unlocked-bg);
      border-color: var(--badge-unlocked-border);
    }

    .achievement-badge.locked {
      opacity: 0.6;
    }

    .achievement-left {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .achievement-icon {
      font-size: 28px;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .achievement-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .achievement-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      word-break: break-word;
    }

    .achievement-description {
      font-size: 13px;
      color: var(--text-muted);
      word-break: break-word;
    }

    .achievement-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .achievement-score {
      font-size: 13px;
      font-weight: 800;
      color: var(--score-color);
      background: rgba(255, 152, 0, 0.15);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .achievement-unlock-date {
      font-size: 11px;
      color: var(--unlocked-green);
      font-weight: 600;
    }

    .achievement-unlock-date.locked {
      color: var(--text-muted);
      font-weight: 400;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Meta Achievements XML Test Viewer</h1>
      <p>Upload your exported XML file to test and inspect your account data</p>
    </header>

    <div class="upload-box" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📄</div>
      <h3>Drop exported XML file here</h3>
      <p>or click to select file from your computer</p>
      <input type="file" id="fileInput" accept=".xml">
    </div>

    <div id="dataView" class="hidden">
      <div class="profile-card">
        <div class="avatar-wrapper" id="profilePfp">
          <div class="avatar-placeholder">🎮</div>
        </div>
        <div class="user-info">
          <h2 id="profileDisplayName">User Profile</h2>
          <p id="profileUserMeta">ID: - | Username: -</p>
          <p id="exportedAtMeta" style="font-size: 11px; margin-top: 4px;">Exported: -</p>
        </div>
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-val" id="statGames">0</div>
            <div class="stat-lbl">Games Tracked</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="statComplete">0</div>
            <div class="stat-lbl">100% Completed</div>
          </div>
          <div class="stat-box">
            <div class="stat-val" id="statUnlocked">0</div>
            <div class="stat-lbl">Achievements</div>
          </div>
          <div class="stat-box">
            <div class="stat-val score" id="statScore">0</div>
            <div class="stat-lbl">Earned Score</div>
          </div>
        </div>
      </div>

      <div class="controls-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search games or achievements..." oninput="filterGames()">
        <button class="filter-btn active" onclick="setFilter('all', this)">All Games</button>
        <button class="filter-btn" onclick="setFilter('completed', this)">100% Completed</button>
        <button class="filter-btn" onclick="setFilter('in-progress', this)">In Progress</button>
      </div>

      <div class="games-list" id="gamesList"></div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    let parsedXmlData = null;
    let currentFilter = 'all';
    const openSectionsState = {};

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) handleFile(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      if (!file.name.endsWith('.xml') && file.type !== 'text/xml' && file.type !== 'application/xml') {
        alert('Please select a valid XML file.');
        return;
      }

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          parseAndRenderXML(evt.target.result);
        } catch (err) {
          alert('Failed to parse XML file: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    function getText(parent, selector, fallback = '') {
      const el = parent.querySelector(selector);
      return el ? el.textContent.trim() : fallback;
    }

    function parseAndRenderXML(xmlString) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlString, 'text/xml');
      
      const parserError = xmlDoc.querySelector('parsererror');
      if (parserError) {
        throw new Error(parserError.textContent);
      }

      const profile = xmlDoc.querySelector('profile');
      if (!profile) {
        throw new Error('Invalid Meta Achievements XML (missing <profile> tag)');
      }

      // Profile Header
      const displayName = getText(profile, 'display_name', 'Unknown User');
      const username = getText(profile, 'username', 'N/A');
      const userId = getText(profile, 'user_id', 'N/A');
      let pfpUrl = getText(profile, 'profile_picture_url');
      if (pfpUrl && pfpUrl.startsWith('/')) {
        pfpUrl = 'https://meta-achievements.org' + pfpUrl;
      }
      const exportedAt = getText(profile, 'exported_at');

      document.getElementById('profileDisplayName').textContent = displayName;
      document.getElementById('profileUserMeta').textContent = `ID: ${userId} | Username: ${username}`;
      document.getElementById('exportedAtMeta').textContent = exportedAt ? `Exported: ${new Date(exportedAt).toLocaleString()}` : '';

      const pfpContainer = document.getElementById('profilePfp');
      if (pfpUrl) {
        pfpContainer.innerHTML = `<img src="${pfpUrl}" alt="Profile Avatar" onerror="this.outerHTML='<div class=\\'avatar-placeholder\\'>🎮</div>'">`;
      } else {
        pfpContainer.innerHTML = `<div class="avatar-placeholder">🎮</div>`;
      }

      // Profile Stats
      document.getElementById('statGames').textContent = getText(profile, 'games_tracked', '0');
      document.getElementById('statComplete').textContent = getText(profile, 'completed_games', '0');
      document.getElementById('statUnlocked').textContent = getText(profile, 'total_achievements_unlocked', '0');
      
      const earnedScore = parseInt(getText(profile, 'total_score_earned', '0'));
      const potentialScore = parseInt(getText(profile, 'total_score_potential', '0'));
      document.getElementById('statScore').textContent = `${earnedScore.toLocaleString()} / ${potentialScore.toLocaleString()}`;

      // Parse Games
      const gameNodes = xmlDoc.querySelectorAll('games > game');
      parsedXmlData = [];

      gameNodes.forEach(gNode => {
        const game = {
          app_id: getText(gNode, 'app_id'),
          app_name: getText(gNode, 'app_name', 'Unknown Game'),
          app_icon_url: getText(gNode, 'app_icon_url'),
          total_achievements: parseInt(getText(gNode, 'total_achievements', '0')),
          unlocked_achievements: parseInt(getText(gNode, 'unlocked_achievements', '0')),
          is_complete: getText(gNode, 'is_complete') === 'true',
          earned_score: parseInt(getText(gNode, 'earned_score', '0')),
          potential_score: parseInt(getText(gNode, 'potential_score', '0')),
          achievements: []
        };

        const achNodes = gNode.querySelectorAll('achievements > achievement');
        achNodes.forEach(aNode => {
          game.achievements.push({
            id: getText(aNode, 'id'),
            api_name: getText(aNode, 'api_name'),
            title: getText(aNode, 'title', 'Achievement'),
            description: getText(aNode, 'description'),
            unlocked: getText(aNode, 'unlocked') === 'true',
            unlock_date: getText(aNode, 'unlock_date'),
            score: parseInt(getText(aNode, 'score', '5')),
            unlocked_image_url: getText(aNode, 'unlocked_image_url') || getText(aNode, 'unlocked_image_uri'),
            locked_image_url: getText(aNode, 'locked_image_url') || getText(aNode, 'locked_image_uri')
          });
        });

        parsedXmlData.push(game);
      });

      document.getElementById('dataView').classList.remove('hidden');
      renderGames();
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGames();
    }

    function filterGames() {
      renderGames();
    }

    function toggleAchievements(appId) {
      openSectionsState[appId] = !openSectionsState[appId];
      const section = document.getElementById(`ach-section-${appId}`);
      const btn = document.getElementById(`toggle-btn-${appId}`);
      if (section && btn) {
        if (openSectionsState[appId]) {
          section.classList.remove('hidden');
          btn.innerHTML = `Hide Achievements ▲`;
        } else {
          section.classList.add('hidden');
          btn.innerHTML = `Show Achievements (${btn.getAttribute('data-count')}) ▼`;
        }
      }
    }

    function renderGames() {
      if (!parsedXmlData) return;
      const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const container = document.getElementById('gamesList');
      container.innerHTML = '';

      const filtered = parsedXmlData.filter(game => {
        if (currentFilter === 'completed' && !game.is_complete) return false;
        if (currentFilter === 'in-progress' && game.is_complete) return false;

        if (searchQuery) {
          const nameMatch = game.app_name.toLowerCase().includes(searchQuery);
          const achMatch = game.achievements.some(a => 
            a.title.toLowerCase().includes(searchQuery) || a.description.toLowerCase().includes(searchQuery)
          );
          return nameMatch || achMatch;
        }

        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">No games matching filter criteria.</div>`;
        return;
      }

      filtered.forEach(game => {
        const percent = game.total_achievements > 0 
          ? Math.round((game.unlocked_achievements / game.total_achievements) * 100)
          : 0;

        const isOpen = !!openSectionsState[game.app_id];
        const card = document.createElement('div');
        card.className = `app-card ${game.is_complete ? 'app-card-100-percent' : ''}`;

        let achHtml = '';
        game.achievements.forEach(ach => {
          const formattedDate = ach.unlock_date 
            ? new Date(ach.unlock_date).toLocaleDateString()
            : 'Locked';

          // Icon rendering logic matching table_new.js
          let achIconHtml = ach.unlocked ? '🏆' : '🔒';
          const primaryImgUrl = ach.unlocked ? ach.unlocked_image_url : ach.locked_image_url;
          const fallbackGameIcon = game.app_icon_url || `https://oculusdb.rui2015.me/cdn/images/${game.app_id}`;
          const targetImgUrl = primaryImgUrl || fallbackGameIcon;

          if (targetImgUrl) {
            const extraStyle = (!ach.unlocked && !primaryImgUrl) ? 'filter: grayscale(100%) opacity(0.6);' : '';
            const fallbackEmoji = ach.unlocked ? '🏆' : '🔒';
            achIconHtml = `<img src="${escapeHtml(targetImgUrl)}" alt="${escapeHtml(ach.title)}" style="width:100%;height:100%;object-fit:contain;${extraStyle}" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='${escapeHtml(fallbackGameIcon)}';}else{this.style.display='none';this.parentNode.textContent='${fallbackEmoji}';}">`;
          }

          achHtml += `
            <div class="achievement-badge ${ach.unlocked ? 'unlocked' : 'locked'}">
              <div class="achievement-left">
                <div class="achievement-icon">${achIconHtml}</div>
                <div class="achievement-info">
                  <div class="achievement-title">${escapeHtml(ach.title)}</div>
                  <div class="achievement-description">${escapeHtml(ach.description || 'No description available')}</div>
                </div>
              </div>
              <div class="achievement-right">
                <span class="achievement-score">+${ach.score} S</span>
                <span class="achievement-unlock-date ${ach.unlocked ? '' : 'locked'}">${ach.unlocked ? '✓ ' + formattedDate : 'Locked'}</span>
              </div>
            </div>
          `;
        });

        const iconSrc = game.app_icon_url || '';
        const iconElement = iconSrc 
          ? `<img src="${iconSrc}" alt="${escapeHtml(game.app_name)}" onerror="this.outerHTML='🎮'">`
          : '🎮';

        card.innerHTML = `
          <div class="app-header">
            <div class="app-icon">${iconElement}</div>
            <div class="app-info">
              <h3>
                ${escapeHtml(game.app_name)}
                ${game.is_complete ? '<span class="badge-100-tag">100% Complete</span>' : ''}
              </h3>
              <div class="app-id-tag">AppID: ${game.app_id}</div>
            </div>
          </div>

          <div class="app-stats">
            <div class="stat">
              <div class="stat-value">${game.unlocked_achievements} / ${game.total_achievements}</div>
              <div class="stat-label">Unlocked</div>
            </div>
            <div class="stat">
              <div class="stat-value">${percent}%</div>
              <div class="stat-label">Completion</div>
            </div>
            <div class="stat score-stat">
              <div class="stat-value">${game.earned_score.toLocaleString()}</div>
              <div class="stat-label">Score (of ${game.potential_score.toLocaleString()})</div>
            </div>
          </div>

          <button class="toggle-btn" id="toggle-btn-${game.app_id}" data-count="${game.total_achievements}" onclick="toggleAchievements('${game.app_id}')">
            ${isOpen ? 'Hide Achievements ▲' : `Show Achievements (${game.total_achievements}) ▼`}
          </button>

          <div class="achievements-section ${isOpen ? '' : 'hidden'}" id="ach-section-${game.app_id}">
            ${achHtml || '<p style="color:var(--text-muted); font-size:13px; text-align:center; padding:10px;">No achievements defined for this game.</p>'}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }
  </script>
</body>
</html>
